[project]
name = "app"
version = "0.0.0"
description = "Python project template. You own the package layout; the checks are the rules."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
prove = "checks._run:main"

[dependency-groups]
dev = [
  "import-linter>=2.1",
  "mypy>=1.13",
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "checks"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "checks", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "BLE", "B006", "E722", "T", "PGH003", "PGH004", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "checks"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "checks", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["app", "checks"]

# Add a layers contract in pyproject when real packages exist (e.g. adapters → application → domain).

[[tool.importlinter.contracts]]
name = "Package root does not import the package"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["app.**"]
as_packages = false

[[tool.importlinter.contracts]]
name = "Application does not import checks"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["checks"]
